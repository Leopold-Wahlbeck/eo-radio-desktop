name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Intel and Apple Silicon apps
        run: npm run dist:mac

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/Empty-Orchestra-Radio-*-mac-* --clobber
